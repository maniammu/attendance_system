{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<form method="GET">

    <input type="text"
           name="search"
           placeholder="Search Student">

    <button type="submit">
        Search
    </button>

</form>

<br>
<html>
<head>
    <title>Student List</title>
</head>
<body>

<h1>Student List</h1>

<table class="table table-hover">

<tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Email</th>
    <th>Department</th>
    <th>Actions</th>
</tr>

{% for student in students %}
<tr>

<td>{{ student.roll_no }}</td>
<td>{{ student.name }}</td>
<td>{{ student.email }}</td>
<td>{{ student.department }}</td>

<td>
    <a href="/edit-student/{{ student.id }}/">
        Edit
    </a>

    |

    <a href="/delete-student/{{ student.id }}/">
        Delete
    </a>
</td>

</tr>
{% endfor %}

</table>
</body>
</html>
<a href="/add-student/">Add New Student</a>

<br><br>
<a href="/student-history/{{ student.id }}/">
    History
</a>
{% endblock %}
