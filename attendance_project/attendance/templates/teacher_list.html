{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Teacher List</h2>

        <a href="/add-teacher/" class="btn btn-primary">
            Add Teacher
        </a>
    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                {% for teacher in teachers %}

                    <tr>
                        <td>{{ teacher.id }}</td>
                        <td>{{ teacher.name }}</td>
                        <td>{{ teacher.email }}</td>
                        <td>{{ teacher.subject }}</td>

                        <td>

                            <a href="/edit-teacher/{{ teacher.id }}/"
                               class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a href="/delete-teacher/{{ teacher.id }}/"
                               class="btn btn-danger btn-sm">
                                Delete
                            </a>

                        </td>

                    </tr>

                {% empty %}

                    <tr>
                        <td colspan="5" class="text-center">
                            No Teachers Found
                        </td>
                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
