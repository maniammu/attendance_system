{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>
<body>

<h1>Attendance Report</h1>

<table class="table table-hover">

<tr>
    <th>Student</th>
    <th>Date</th>
    <th>Status</th>
</tr>

{% for record in records %}
<tr>
    <td>{{ record.student.name }}</td>
    <td>{{ record.date }}</td>
    <td>{{ record.status }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/">Dashboard</a>

</body>
</html>
{% endblock %}
