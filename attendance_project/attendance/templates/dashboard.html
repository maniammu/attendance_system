{% extends 'base.html' %}

{% block content %}

<h2>Dashboard</h2>

<div class="row">

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">

<h5>Total Students</h5>

<h2>{{ total_students }}</h2>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">

<h5>Present Today</h5>

<h2>{{ present_today }}</h2>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<div class="card-body">

<h5>Absent Today</h5>

<h2>{{ absent_today }}</h2>

</div>
</div>
</div>

</div>

<hr>

<canvas id="attendanceChart"></canvas>

{% endblock %}
